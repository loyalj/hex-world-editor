<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex World Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <div id="ribbon">
        <div class="menu-dropdown" id="map-menu">
          <button class="ribbon-btn" id="map-menu-btn">Map</button>
          <div class="menu-panel hidden" id="map-menu-panel">
            <button class="menu-item" id="new-map-btn">New</button>
            <button class="menu-item" id="save-btn">Save</button>
            <button class="menu-item" id="load-btn">Load</button>
            <input type="file" id="load-input" accept=".hxmp,.json" style="display:none" />
          </div>
        </div>
        <div class="ribbon-divider"></div>
        <div class="ribbon-group" id="tool-buttons">
          <button class="tool-btn active" data-tool="paint-terrain">Terrain</button>
          <button class="tool-btn" data-tool="elevation">Elevation</button>
          <button class="tool-btn" data-tool="paint-river">River</button>
          <button class="tool-btn" data-tool="paint-road">Road</button>
          <button class="tool-btn" data-tool="paint-scatter">Scatter</button>
        </div>
        <div class="ribbon-spacer"></div>
      </div>

      <div id="main">

        <aside id="left-panel">
          <div id="terrain-options" class="panel">
            <div class="panel-title">Terrain Type</div>
            <div id="terrain-type-group">
              <button class="terrain-btn active" data-terrain="0" title="Grassland"></button>
              <button class="terrain-btn"        data-terrain="1" title="Desert"></button>
              <button class="terrain-btn"        data-terrain="2" title="Snow"></button>
              <button class="terrain-btn"        data-terrain="3" title="Mud"></button>
              <button class="terrain-btn"        data-terrain="4" title="Rock"></button>
              <button class="terrain-btn"        data-terrain="5" title="Water"></button>
            </div>
            <div class="group-header">Brush</div>
            <div class="brush-group" id="terrain-brush-group">
              <button class="brush-btn active" data-brush="0" title="1 cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="1" title="7 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="2" title="19 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="3" title="37 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/></svg></button>
            </div>
          </div>
          <div id="elevation-options" class="panel hidden">
            <div class="panel-title">Elevation</div>
            <div class="group-header">Step</div>
            <div class="brush-group" id="elev-step-group">
              <button class="brush-btn" data-step="-2" title="Lower by 2">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="2" fill="currentColor"/>
                  <rect x="5" y="14" width="14" height="4" fill="currentColor"/>
                  <rect x="5" y="19" width="14" height="4" fill="currentColor"/>
                </svg>
              </button>
              <button class="brush-btn" data-step="-1" title="Lower by 1">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="2" fill="currentColor"/>
                  <rect x="5" y="14" width="14" height="5" fill="currentColor"/>
                </svg>
              </button>
              <button class="brush-btn active" data-step="1" title="Raise by 1">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="2" fill="currentColor"/>
                  <rect x="5" y="5" width="14" height="5" fill="currentColor"/>
                </svg>
              </button>
              <button class="brush-btn" data-step="2" title="Raise by 2">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="2" fill="currentColor"/>
                  <rect x="5" y="1" width="14" height="4" fill="currentColor"/>
                  <rect x="5" y="6" width="14" height="4" fill="currentColor"/>
                </svg>
              </button>
            </div>
            <div class="group-header">Brush</div>
            <div class="brush-group" id="elev-brush-group">
              <button class="brush-btn active" data-brush="0" title="1 cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="1" title="7 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="2" title="19 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="3" title="37 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/></svg></button>
            </div>
          </div>
          <div id="scatter-options" class="panel hidden">
            <div class="panel-title">Density</div>
            <div id="density-group">
              <button class="density-btn" data-density="0">None</button>
              <button class="density-btn active" data-density="1">Sparse</button>
              <button class="density-btn" data-density="2">Medium</button>
              <button class="density-btn" data-density="3">Dense</button>
            </div>
            <div class="group-header">Brush</div>
            <div class="brush-group" id="scatter-brush-group">
              <button class="brush-btn active" data-brush="0" title="1 cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="1" title="7 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="2" title="19 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"  fill="currentColor"/></svg></button>
              <button class="brush-btn"        data-brush="3" title="37 cells"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/></svg></button>
            </div>
          </div>
          <div id="river-options" class="panel hidden">
            <div class="panel-title">Mode</div>
            <div class="brush-group" id="river-mode-group">
              <button class="brush-btn active" data-river-mode="path" title="Pathfinding">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4,19 C4,11 20,13 20,5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="4"  cy="19" r="2.5" fill="currentColor"/>
                  <circle cx="20" cy="5"  r="2.5" fill="currentColor"/>
                </svg>
              </button>
              <button class="brush-btn" data-river-mode="straight" title="Straight line">
                <svg viewBox="0 0 24 24" fill="none">
                  <line x1="4" y1="19" x2="20" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="4"  cy="19" r="2.5" fill="currentColor"/>
                  <circle cx="20" cy="5"  r="2.5" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="road-options" class="panel hidden">
            <div class="panel-title">Mode</div>
            <div class="brush-group" id="road-mode-group">
              <button class="brush-btn active" data-road-mode="path" title="Pathfinding">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4,19 C4,11 20,13 20,5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="4"  cy="19" r="2.5" fill="currentColor"/>
                  <circle cx="20" cy="5"  r="2.5" fill="currentColor"/>
                </svg>
              </button>
              <button class="brush-btn" data-road-mode="straight" title="Straight line">
                <svg viewBox="0 0 24 24" fill="none">
                  <line x1="4" y1="19" x2="20" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="4"  cy="19" r="2.5" fill="currentColor"/>
                  <circle cx="20" cy="5"  r="2.5" fill="currentColor"/>
                </svg>
              </button>
            </div>
            <div id="road-cost-options" class="hidden">
              <div class="group-header">Costs</div>
              <label class="toggle-row">
                <span>Elevation</span>
                <input type="checkbox" id="road-cost-elev" />
              </label>
              <label class="toggle-row">
                <span>Terrain</span>
                <input type="checkbox" id="road-cost-terrain" />
              </label>
              <label class="toggle-row">
                <span>Follow roads</span>
                <input type="checkbox" id="road-cost-roads" />
              </label>
            </div>
          </div>

        </aside>

        <div id="viewport"></div>

        <aside id="right-panel">
          <div class="panel">
            <div class="panel-title">Inspector</div>
            <div id="inspector">
              <div class="insp-row"><span>Cell</span><span id="insp-pos">—</span></div>
              <div class="insp-row"><span>Terrain</span><span id="insp-terrain">—</span></div>
              <div class="insp-row"><span>Elevation</span><span id="insp-elev">—</span></div>
              <div class="insp-row"><span>River</span><span id="insp-river">—</span></div>
              <div class="insp-row"><span>Road</span><span id="insp-road">—</span></div>
              <div class="insp-row"><span>Scatter</span><span id="insp-scatter">—</span></div>
            </div>
          </div>
        </aside>

      </div>
    </div>
    <dialog id="new-map-dialog">
      <div class="dialog-header">
        <span class="dialog-title">New Map</span>
        <button class="dialog-close" id="dialog-close-btn">&#x2715;</button>
      </div>
      <div class="dialog-body">
        <label class="field">
          <span>Width</span>
          <input id="map-width-input" type="number" min="10" value="100" autocomplete="off" />
        </label>
        <label class="field">
          <span>Height</span>
          <input id="map-height-input" type="number" min="10" value="100" autocomplete="off" />
        </label>
        <label class="field">
          <span>Generator</span>
          <select id="generator-select"></select>
        </label>
        <label class="field">
          <span>Seed</span>
          <div class="seed-row">
            <input id="seed-input" type="number" min="0" max="4294967295" />
            <button id="new-seed-btn" title="Random seed">&#9861;</button>
          </div>
        </label>
        <div id="config-fields"></div>
        <button id="create-map-btn">Create Map</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
