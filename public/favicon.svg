<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Same mark as the in-app brand: a world seen from far off, flattened onto
       a pointy-top hex. Everything is clipped to the hex so the silhouette
       stays exact. The outline is a deep ocean blue rather than white, because
       a favicon sits on whatever the browser's tab strip is — the white polar
       caps need an edge to hold against a light background. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a92ff" />
      <stop offset="0.5" stop-color="#2e9fc9" />
      <stop offset="1" stop-color="#2aa46b" />
    </linearGradient>
    <linearGradient id="limb" x1="0.15" y1="0.1" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <clipPath id="hex">
      <path d="M16 1 28.99 8.5v15L16 31 3.01 23.5v-15z" />
    </clipPath>
  </defs>
  <g clip-path="url(#hex)">
    <rect width="32" height="32" fill="url(#sea)" />
    <g fill="#3cab5e">
      <ellipse cx="10.68" cy="14.36" rx="5.05" ry="3.68" transform="rotate(-26 10.68 14.36)" />
      <ellipse cx="13" cy="19.14" rx="3.68" ry="2.73" transform="rotate(16 13 19.14)" />
      <ellipse cx="22.82" cy="20.36" rx="4.09" ry="3" transform="rotate(22 22.82 20.36)" />
      <ellipse cx="21.59" cy="12.45" rx="2.59" ry="1.91" transform="rotate(-16 21.59 12.45)" />
    </g>
    <ellipse cx="16" cy="1.55" rx="11.73" ry="5.05" fill="#f4f8fc" />
    <ellipse cx="16" cy="30.45" rx="11.73" ry="5.05" fill="#e9f1f8" />
    <rect width="32" height="32" fill="url(#limb)" />
  </g>
  <path d="M16 1 28.99 8.5v15L16 31 3.01 23.5v-15z"
        fill="none" stroke="#0f4c81" stroke-opacity="0.45" stroke-width="1.1" stroke-linejoin="round" />
</svg>
